name: hourly refresh (board colour, language stats)
on:
  schedule:
    - cron: '7 * * * *'   # every hour
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 assets/gen.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: re-render the languages panel only when the numbers changed
        run: |
          if ! git diff --quiet assets/langs.json; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
            node assets/render/render.mjs languages
          fi
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "hourly refresh" && git push)
