<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0d1117}</style></head><body><canvas id="c" width="1600" height="560"></canvas>
<script src="paper.js"></script><script>
window.onerror=function(m,s,l,c){window.__err=m+' @'+l+':'+c;};
// The header: the board as a paper cut-out. render.mjs injects the fonts, calls setup(), then frame(t) for every frame.
const W=1600,H=560,T=8,V=300;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let seed=11; function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function samples(pts){const out=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(L));for(let j=0;j<n;j++)out.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n]);}out.push(pts[pts.length-1]);return out;}
const routes=[],signals=[],flashes=[],vias=[],parts=[],pins=[];
function route(pts,w){const r={pts:pts,w:w||3.6,s:samples(pts)};routes.push(r);return r;}
function signal(r,t0,rev,fr){const s=rev?r.s.slice().reverse():r.s;signals.push({s:s,t0:t0});if(fr){const e=s[s.length-1];flashes.push({x:e[0],y:e[1],t:t0+(s.length-1)/V,r:fr});}}
const U1={x:1060,y:270,h:78}, U2={x:1430,y:330,w:45,h:85};
for(let k=0;k<14;k++){const o=-65+10*k;pins.push([U1.x+o-3,U1.y-U1.h-9,6,11],[U1.x+o-3,U1.y+U1.h-2,6,11],[U1.x-U1.h-9,U1.y+o-3,11,6],[U1.x+U1.h-2,U1.y+o-3,11,6]);}
for(let k=0;k<12;k++)pins.push([U2.x-U2.w-9,U2.y-55+10*k-3,11,6]);
pins.push([1415,U2.y-U2.h-9,6,11],[1425,U2.y-U2.h-9,6,11]);
const bus=[];
for(let k=0;k<12;k++){const y=U1.y-55+10*k,xj=1205-k*4.14;bus.push(route([[U1.x+U1.h+7,y],[xj,y],[xj+60,y+60],[U2.x-U2.w-7,y+60]],3.2));}
const topB=[];
function offsetPoly(pts,d){const out=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[i],c=pts[Math.min(pts.length-1,i+1)];const n=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l];};const n1=i>0?n(a,b):n(b,c),n2=i<pts.length-1?n(b,c):n(a,b);let mx=n1[0]+n2[0],my=n1[1]+n2[1];const ml=Math.hypot(mx,my);mx/=ml;my/=ml;const s=d/(mx*n1[0]+my*n1[1]);out.push([b[0]+mx*s,b[1]+my*s]);}return out;}
const P0=10;{const x0=U1.x-45,yh0=130,base=[[x0,U1.y-U1.h-7],[x0,yh0+36],[x0-36,yh0],[0,yh0]];for(let k=0;k<10;k++){const xe=700-k*42-rnd()*26,o=offsetPoly(base,k*P0);o[0][1]=U1.y-U1.h-7;o[3][0]=xe;topB.push(route(o,3.6));vias.push([xe,o[3][1],0]);}}
const bot=[];
const bbase=[[U1.x-35,U1.y+U1.h+7],[U1.x-35,405-36],[U1.x-71,405],[0,405]];
for(let k=0;k<8;k++){const xe=790-k*44,o=offsetPoly(bbase,-k*P0);o[0][1]=U1.y+U1.h+7;o[3][0]=xe;const yh=o[3][1];bot.push(route(o,3.6));
  if(k%2===0){parts.push({x:xe-9,y:yh,type:'r'});route([[xe-22,yh],[xe-40,yh]],3);vias.push([xe-40,yh,0]);}else vias.push([xe,yh,0]);}
parts.push({x:915,y:255,type:'xtal'});
const clkA=route([[915,220],[915,215],[925,205],[U1.x-U1.h-7,205]],3), clkB=route([[915,290],[915,295],[925,305],[U1.x-U1.h-7,305]],3);
for(const y of [226,284]){parts.push({x:872,y:y,type:'c'});route([[885,y],[902,y]],3);route([[859,y],[846,y]],3);vias.push([846,y,0]);}
const pa=route([[1418,238],[1418,96],[1452,62],[1612,62]],3);
const mb=[[1428,238],[1428,206]];for(let i=0;i<3;i++){const y=206-i*24;mb.push([1435,y-7],[1435,y-13],[1428,y-20]);}
mb.push([1428,100],[1456,72],[1612,72]);const pb=route(mb,3);
function nearRoute(x,y,d){for(const r of routes)for(let i=0;i<r.s.length;i+=3){const p=r.s[i];if(Math.abs(p[0]-x)<d&&Math.abs(p[1]-y)<d)return true;}return false;}
const keep=[[U1.x-U1.h-32,U1.y-U1.h-32,2*U1.h+64,2*U1.h+64],[U2.x-U2.w-30,U2.y-U2.h-30,2*U2.w+60,2*U2.h+60],[830,190,130,130],[1500,460,100,100]];
for(let y=22;y<H-12;y+=26)for(let x=840+((y-22)/26%2)*13;x<W-12;x+=26){if(rnd()<.42)continue;if(keep.some(b=>x>b[0]&&x<b[0]+b[2]&&y>b[1]&&y<b[1]+b[3]))continue;if(nearRoute(x,y,14))continue;vias.push([x,y,1]);}
bus.forEach(r=>signal(r,.6,false,16));
[1,4,6,9,11].forEach(k=>signal(bus[k],3.9,true,12));
topB.forEach((r,k)=>signal(r,1.5+k*.05,false,22));
bot.forEach((r,k)=>signal(r,4.7+k*.05,false,18));
for(let i=0;i<8;i++)signal(clkA,i,false,0);
signal(pa,2.6,false,0);signal(pb,2.6,false,0);


const MH=[[64,64],[1540,505]];
function partPads(p){if(p.type==='xtal')return [[p.x-13,p.y-35,26,12],[p.x-13,p.y+23,26,12]];return [[p.x-13,p.y-4.5,8,9],[p.x+5,p.y-4.5,8,9]];}
function cutBoard(x){for(const r of routes){path(x,r.pts);x.lineWidth=CUT;x.stroke();}
  for(const v of vias){x.beginPath();x.arc(v[0],v[1],v[2]?4.2:8.5,0,7);x.fill();}
  for(const h of MH){x.beginPath();x.arc(h[0],h[1],27,0,7);x.fill();}}
function drawPieces(){
  vias.forEach((v,i)=>{if(!v[2])piece(100+i,v[0],v[1],c=>{c.fillStyle=PAT.gold;donut(c,8.5,3.6);},.5);});
  MH.forEach((h,i)=>piece(90+i,h[0],h[1],c=>{c.fillStyle=PAT.gold;donut(c,24,14);},.8));
  pins.forEach((p,i)=>piece(400+i,p[0]+p[2]/2,p[1]+p[3]/2,c=>{c.fillStyle=PAT.gold;rrect(c,-p[2]/2,-p[3]/2,p[2],p[3],1.5);c.fill();},.4));
  parts.forEach((p,i)=>{for(const [k,q] of partPads(p).entries())piece(700+i*3+k,q[0]+q[2]/2,q[1]+q[3]/2,c=>{c.fillStyle=PAT.gold;rrect(c,-q[2]/2,-q[3]/2,q[2],q[3],2);c.fill();},.4);
    if(p.type==='xtal')piece(800+i,p.x,p.y,c=>{c.fillStyle=PAT.silver;rrect(c,-16,-24,32,48,5);c.fill();c.shadowColor='transparent';c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1.2;rrect(c,-11,-19,22,38,3);c.stroke();},1.2);
    else piece(800+i,p.x,p.y,c=>{c.fillStyle=p.type==='r'?PAT.char:PAT.tan;rrect(c,-7,-4.2,14,8.4,1.2);c.fill();},.9);});
  piece(1,U1.x,U1.y,c=>{const w=U1.h-4;c.fillStyle=PAT.char;rrect(c,-w,-w,2*w,2*w,6);c.fill();c.shadowColor='transparent';
    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.arc(-w+15,-w+15,4.5,0,7);c.fill();
    c.textAlign='center';c.fillStyle='rgba(236,230,214,.34)';c.font='30px LB';c.letterSpacing='3px';c.fillText('M2L',0,6);c.font='12px LR';c.letterSpacing='2px';c.fillStyle='rgba(236,230,214,.24)';c.fillText('32-BIT CPU',0,30);},2.2);
  piece(2,U2.x,U2.y,c=>{c.fillStyle=PAT.char;rrect(c,-U2.w+2,-U2.h,2*U2.w-4,2*U2.h,6);c.fill();c.shadowColor='transparent';
    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.arc(-U2.w+14,-U2.h+13,4,0,7);c.fill();
    c.rotate(-Math.PI/2);c.fillStyle='rgba(236,230,214,.3)';c.font='17px LB';c.textAlign='center';c.fillText('FLASH 128M',0,10);},1.8);
  [['U1',U1.x+U1.h+14,U1.y-U1.h-20],['U2',U2.x+U2.w+12,U2.y-U2.h+8],['Y1',938,262],['C1',852,212],['C2',852,306],['USB',1470,52]].forEach((l,i)=>label(950+i,l[0],l[1],l[2],'13px LBo',PAT.white,.35,'left',1.5));
  label(960,'M2L-MAIN  ·  REV 3',1300,540,'12px LBo',PAT.white,.35,'left',2);
}
let S,LIGHT;
function frame(t){
  t=((t%T)+T)%T;const ts=setFrame(t);
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();rrect(ctx,0,0,W,H,30);ctx.clip();
  ctx.fillStyle=PAT.under;ctx.fillRect(0,0,W,H);
  grooveTokens(signals,ts,T,V,16);
  drawSheet(S);
  drawPieces();
  letters(31,'hi, i’m',112,226,'28px LBo',1.5,PAT.ochre,.8,.08);
  letters(32,'Merlin2LmmL',102,334,'112px LB',-1.5,PAT.cream,1.8,.05);
  letters(33,'robots, circuit boards, my own CPU, and little JavaScript worlds',112,388,'29px LR',.2,PAT.mint,.5,.06);
  applyLight(LIGHT);
  ctx.restore();
  return cv.toDataURL('image/png');
}
window.setup=function(){paperInit();S=makeSheet(W,H,[0,0,W,H],12,22,cutBoard);LIGHT=makeLight(W,H,380,60,1500);window.frame=frame;return {w:W,h:H,T:T,fps:FPS};};
</script></body></html>
