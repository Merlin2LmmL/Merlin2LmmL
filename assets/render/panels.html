<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0d1117}</style></head><body><canvas id="c"></canvas>
<script src="paper.js"></script><script src="ledstar.js"></script><script>
window.onerror=function(m,s,l,c){window.__err=m+' @'+l+':'+c;};
// The panels below the header, as paper cut-outs like the header. render.mjs injects the fonts, calls setup(name, data), then frame(t) for every frame.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const V=300,TAU=Math.PI*2,RADIUS=30;
const ARROW=String.fromCharCode(0x2192),DOT=String.fromCharCode(0xb7);
const LANG_COLORS={JavaScript:'#e6c46a',Java:'#d98f6a',Python:'#7fa6cc',C:'#9cbf93',Rust:'#c9796f',HTML:'#b893c9',Assembly:'#86c2b8',Kotlin:'#a493d6',CSS:'#8ea0d6',Verilog:'#cdb68a'};
let seed=1;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function mod(a,b){return ((a%b)+b)%b;}
function samples(pts){const out=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(L));for(let j=0;j<n;j++)out.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n]);}out.push(pts[pts.length-1]);return out;}
function segN(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return [-dy/L,dx/L];}
function offsetPoly(pts,d){const out=[];for(let i=0;i<pts.length;i++){const p=pts[i];let nx=0,ny=0,n1=null;if(i>0){n1=segN(pts[i-1],p);nx+=n1[0];ny+=n1[1];}if(i<pts.length-1){const n2=segN(p,pts[i+1]);nx+=n2[0];ny+=n2[1];if(!n1)n1=n2;}const L=Math.hypot(nx,ny);nx/=L;ny/=L;const k=1/(nx*n1[0]+ny*n1[1]);out.push([p[0]+nx*d*k,p[1]+ny*d*k]);}return out;}
// 45-degree walk: dir 0=east,1=south-east,2=south ...; steps are [length, turn afterwards in 45-degree units]
function walk(x,y,dir,steps){const pts=[[x,y]];let d=dir;for(const s of steps){const a=d*Math.PI/4;x+=Math.cos(a)*s[0];y+=Math.sin(a)*s[0];pts.push([x,y]);d+=s[1];}return pts;}
function inRects(x,y,rs,m){return rs.some(b=>x>b[0]-m&&x<b[0]+b[2]+m&&y>b[1]-m&&y<b[1]+b[3]+m);}

function Board(w,h){this.w=w;this.h=h;this.routes=[];this.vias=[];this.keep=[];this.signals=[];this.slots=[];}
Board.prototype.route=function(pts,cw){const r={pts:pts,cw:cw||CUT,s:samples(pts)};this.routes.push(r);return r;};
Board.prototype.bundle=function(base,n,sp,cw,via){const rs=[];for(let k=0;k<n;k++){const p=offsetPoly(base,(k-(n-1)/2)*sp);rs.push(this.route(p,cw));if(via){const e=p[p.length-1];this.vias.push([e[0],e[1],0,sp<16]);}}return rs;};
Board.prototype.signal=function(r,t0,rev){this.signals.push({s:rev?r.s.slice().reverse():r.s,t0:t0});};
Board.prototype.near=function(x,y,d){for(const r of this.routes)for(let i=0;i<r.s.length;i+=3){const p=r.s[i];if(Math.abs(p[0]-x)<d&&Math.abs(p[1]-y)<d)return true;}for(const v of this.vias)if(Math.abs(v[0]-x)<d&&Math.abs(v[1]-y)<d)return true;return false;};
Board.prototype.stitch=function(step,prob){const pts=[];for(let y=step*.7;y<this.h-8;y+=step){const row=Math.round(y/step);for(let x=step*.6+(row%2)*step/2;x<this.w-8;x+=step){if(rnd()>prob)continue;if(inRects(x,y,this.keep,6))continue;if(this.near(x,y,13))continue;pts.push([x,y,1]);}}for(const p of pts)this.vias.push(p);};
Board.prototype.cut=function(x){for(const r of this.routes){path(x,r.pts);x.lineWidth=r.cw;x.stroke();}
  for(const v of this.vias){x.beginPath();x.arc(v[0],v[1],v[2]?4.2:v[3]?5.4:8.5,0,7);x.fill();}
  for(const s of this.slots){rrect(x,s[0],s[1],s[2],s[3],s[4]);x.fill();}};
Board.prototype.rings=function(id0){this.vias.forEach((v,i)=>{if(!v[2])piece(id0+i,v[0],v[1],c=>{c.fillStyle=PAT.gold;if(v[3])donut(c,5.4,2.3);else donut(c,8.5,3.6);},.5);});};
// every panel: dark paper below, gold strips in the grooves, the cut top sheet, then the panel's own pieces and the light
function stage(B,o){
  const W=B.w,H=B.h;cv.width=W;cv.height=H;const K=o.clip||[0,0,W,H];
  const extra={};for(const k in LANG_COLORS)extra['L_'+k]=LANG_COLORS[k];extra.L_other='#7d8f86';paperInit(extra);
  const S=makeSheet(W,H,K,o.inset||12,o.r||22,x=>B.cut(x)),LIGHT=makeLight(W,H,o.light[0],o.light[1],o.light[2]);
  return function(t){t=mod(t,o.T);const ts=setFrame(t);
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();rrect(ctx,K[0],K[1],K[2],K[3],RADIUS);ctx.clip();
    ctx.fillStyle=PAT.under;ctx.fillRect(0,0,W,H);
    grooveTokens(B.signals,ts,o.T,V,16);
    if(o.under)o.under(ts);
    drawSheet(S);B.rings(5000);
    o.overlay(ts);
    applyLight(LIGHT);ctx.restore();
    return window.PREVIEW?'':cv.toDataURL('image/png');};
}

// ---------------------------------------------------------------- about
function about(D){
  const W=1600,H=200,B=new Board(W,H);seed=21;
  const a=B.bundle(walk(-20,28,0,[[120,1],[14,-1],[40,0]]),3,11,CUT,true);
  const b=B.bundle(walk(1620,174,4,[[120,1],[14,-1],[40,0]]),3,11,CUT,true);
  B.keep=[[110,52,1380,100]];B.stitch(24,.45);
  a.forEach((r,k)=>B.signal(r,.8+k*.06));b.forEach((r,k)=>B.signal(r,4.4+k*.06));
  const frame=stage(B,{T:8,light:[500,0,1500],overlay:function(){
    letters(41,D.content.about[0],800,92,'27px LR',.2,PAT.cream,.6,.05,'center');
    letters(42,D.content.about[1],800,138,'25px LR',.2,PAT.mint,.5,.05,'center');}});
  return {w:W,h:H,T:8,fps:FPS,frame:frame};
}

// ---------------------------------------------------------------- card motifs: little paper puppets, centred on 0,0
function brad(id,x,y){piece(id,x,y,c=>{c.fillStyle=PAT.goldHi;c.beginPath();c.arc(0,0,3.4,0,TAU);c.fill();c.shadowColor='transparent';c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.arc(.6,.6,1.3,0,TAU);c.fill();},1.6);}
function imu(t,id){
  const a=.16*Math.sin(TAU*t/4);
  ctx.save();ctx.rotate(a);
  piece(id+1,-40,0,c=>{c.fillStyle=PAT.silver;rrect(c,-12,-11,24,22,2);c.fill();c.shadowColor='transparent';c.fillStyle=PAT.ink;rrect(c,-7,-5,4,4,1);c.fill();rrect(c,-7,1,4,4,1);c.fill();},.9);
  piece(id+2,5,0,c=>{c.fillStyle=PAT.board;rrect(c,-35,-15,70,30,7);c.fill();},1.2);
  for(let k=0;k<4;k++)piece(id+3+k,-21,-7.5+k*5,c=>{c.fillStyle=PAT.gold;rrect(c,-3,-1.5,6,3,1);c.fill();},.3);
  piece(id+8,10,0,c=>{c.fillStyle=PAT.char;rrect(c,-8,-8,16,16,2);c.fill();},.6);
  const on=mod(t,1)<.5;piece(id+9,31,-8,c=>{c.fillStyle=on?PAT.yellow:PAT.cream;c.beginPath();c.arc(0,0,2.6,0,TAU);c.fill();},on?1.2:.3);
  brad(id+10,-22,8);
  ctx.restore();
  // three paper arrows for the axes, pinned at one point
  const ph=TAU*t/8,O=[10,-22],ax=[[Math.cos(ph),Math.sin(ph)*.45,PAT.red],[-Math.sin(ph),Math.cos(ph)*.45,PAT.green],[0,-1,PAT.blue]];
  ax.forEach((v,k)=>{const L=30*Math.hypot(v[0],v[1]),an=Math.atan2(v[1],v[0]);piece(id+20+k,O[0],O[1],c=>{c.rotate(an);c.fillStyle=v[2];rrect(c,0,-2.2,L,4.4,2);c.fill();c.beginPath();c.arc(L,0,3.6,0,TAU);c.fill();},.8+k*.15);});
  brad(id+25,O[0],O[1]);
}
const LED_PAT={Red:'red',Yellow:'yellow',White:'white',Blue:'blue',Green:'green'};
function snow(t,id){
  const s=1.02,arm=Math.floor(mod(t,5)/1);  // the real board lights one arm at a time
  piece(id+1,0,0,c=>{c.fillStyle=PAT.paper;c.beginPath();LEDSTAR.poly.forEach((p,i)=>i?c.lineTo(p[0]*s,p[1]*s):c.moveTo(p[0]*s,p[1]*s));c.closePath();
    const h=LEDSTAR.hole;c.moveTo(h[0]*s+h[2]*s*1.6,h[1]*s);c.arc(h[0]*s,h[1]*s,h[2]*s*1.6,0,TAU,true);c.fill('evenodd');},1.1);
  piece(id+2,0,0,c=>{c.fillStyle=PAT.char;rrect(c,-4,-6,8,12,1);c.fill();},.4);
  LEDSTAR.leds.forEach((l,i)=>{const an=mod(Math.atan2(l[0],-l[1]),TAU),a=Math.round(an/(TAU/5))%5,lit=a===arm;
    piece(id+10+i,l[0]*s,l[1]*s,c=>{c.fillStyle=lit?PAT[LED_PAT[l[2]]]:PAT.silver;c.beginPath();c.arc(0,0,lit?3.1:2.4,0,TAU);c.fill();},lit?1.3:.25);});
}
function cpu(t,id){
  const h=30,off=[-22.5,-13.5,-4.5,4.5,13.5,22.5],pins=[];
  for(const o of off)pins.push([o,-h-5,0,-1]);for(const o of off)pins.push([h+5,o,1,0]);for(const o of off.slice().reverse())pins.push([o,h+5,0,1]);for(const o of off.slice().reverse())pins.push([-h-5,o,-1,0]);
  const N=24,pos=mod(t/4*N,N);
  pins.forEach((p,i)=>{const d=mod(pos-i,N),up=d<1.5,vert=p[2]===0;piece(id+i,p[0]+p[2]*(up?2:0),p[1]+p[3]*(up?2:0),c=>{c.fillStyle=up?PAT.goldHi:PAT.gold;if(vert)rrect(c,-2.5,-5,5,10,1);else rrect(c,-5,-2.5,10,5,1);c.fill();},up?1.2:.3);});
  piece(id+30,0,0,c=>{c.fillStyle=PAT.char;rrect(c,-h,-h,2*h,2*h,5);c.fill();c.shadowColor='transparent';c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.arc(-h+9,-h+9,3,0,TAU);c.fill();
    c.font='15px LB';c.letterSpacing='2px';c.textAlign='center';c.fillStyle='rgba(236,230,214,.3)';c.fillText('M2L',0,5);},1.8);
}
const ROOM=[];for(let i=0;i<48;i++){const a=i/48*TAU;ROOM.push([a,44+5*Math.sin(3*a+1)+(a>2.2&&a<2.9?-9:0)]);}
function lidar(t,id){
  const th=TAU*t/2;
  ROOM.forEach((p,i)=>{const age=mod(th-p[0],TAU),fresh=age<1.2;piece(id+i,Math.cos(p[0])*p[1],Math.sin(p[0])*p[1],c=>{c.fillStyle=fresh?PAT.yellow:PAT.mint;c.beginPath();c.arc(0,0,fresh?2.4:1.7,0,TAU);c.fill();},fresh?.9:.2);});
  piece(id+60,0,0,c=>{c.rotate(th);c.fillStyle=PAT.cream;c.globalAlpha=.9;c.beginPath();c.moveTo(0,0);c.arc(0,0,40,-.16,.16);c.closePath();c.fill();},.7);
  piece(id+61,0,0,c=>{c.fillStyle=PAT.char;rrect(c,-17,-11,34,22,6);c.fill();},1.3);
  piece(id+62,-4,0,c=>{c.fillStyle=PAT.ink;c.beginPath();c.arc(0,0,5,0,TAU);c.fill();},.5);
  // googly eyes: white paper discs with loose black pupils
  [[10,-5],[10,5]].forEach((e,k)=>{piece(id+63+k,e[0],e[1],c=>{c.fillStyle=PAT.paper;c.beginPath();c.arc(0,0,4.4,0,TAU);c.fill();},.8);
    piece(id+66+k,e[0]+1+.9*Math.sin(TAU*t*5/8+e[1]),e[1]+.9*Math.cos(TAU*t*3/8),c=>{c.fillStyle=PAT.ink;c.beginPath();c.arc(0,0,2.1,0,TAU);c.fill();},.4);});
  brad(id+70,0,0);
}
const MOTIFS={imu:imu,snow:snow,cpu:cpu,lidar:lidar};

// ---------------------------------------------------------------- cards: four images of 400px that together are exactly 1600px wide.
// Each card leaves a 14.5px gutter on its inner sides, so the row's outer edges line up with the full-width panels.
function card(i,D){
  const cd=D.content.cards[i],W=400,H=290,G=14.5,L=i===0?0:G,R=i===3?0:G,PW=W-L-R,B=new Board(W,H);seed=100+i*13;
  const div=B.route([[-20,168],[420,168]]);B.route([[-20,156],[420,156]],2.6);B.route([[-20,180],[420,180]],2.6);
  B.bundle(walk(L+PW-20,300,6,[[46,0]]),3,11,CUT,true);
  B.keep=[[L+14,20,250,100],[L+14,192,PW-60,92],[L+PW-140,6,136,142]];B.stitch(22,.5);
  B.signal(div,.3+i*(400/V));
  const M=MOTIFS[cd.motif],id=10000*(i+1);
  const frame=stage(B,{T:8,clip:[L,0,PW,H],inset:10,r:20,light:[L+60,-20,560],overlay:function(t){
    letters(id/100+1,cd.title,L+28,64,'36px LB',-.3,PAT.cream,1.2,.06);
    letters(id/100+2,cd.sub,L+29,100,'20px LR',.1,PAT.mint,.5,.05);
    letters(id/100+3,ARROW+' '+cd.repo,L+28,234,'24px LBo',.2,PAT.ochre,.8,.06);
    letters(id/100+4,cd.line,L+29,266,'19px LR',.1,PAT.mint,.45,.05);
    ctx.save();ctx.translate(L+PW-74,76);M(t,id+500);ctx.restore();}});
  return {w:W,h:H,T:8,fps:FPS,frame:frame};
}

// ---------------------------------------------------------------- languages, with a punched paper tape sliding past a slot at the bottom
function languages(D){
  const W=1600,H=330,B=new Board(W,H),T=32;seed=300;
  const ent=Object.entries(D.langs.langs).sort((a,b)=>b[1]-a[1]),tot=ent.reduce((s,e)=>s+e[1],0),top=ent.slice(0,7),rest=tot-top.reduce((s,e)=>s+e[1],0);
  const items=top.map(e=>[e[0],e[1],PAT_KEY(e[0])]).concat([['other',rest,'L_other']]);
  const bd=B.bundle(walk(1620,200,4,[[110,-1],[36,1],[90,0]]),4,11,CUT,true);
  const SL=[70,280,1460,22,6];B.slots.push(SL);
  B.keep=[[40,30,520,60],[1060,40,500,45],[40,92,1520,56],[40,158,1320,104],[40,262,1520,60]];B.stitch(24,.45);
  for(let m=0;m<4;m++)bd.forEach((r,k)=>B.signal(r,m*8+2.2+k*.06));
  // the hidden message as one row of bits on the tape: a big hole is a 1, a pinhole is a 0, a gap between bytes
  const bits=[];for(const b of new TextEncoder().encode(D.content.secret)){for(let k=7;k>=0;k--)bits.push(b>>k&1);bits.push(-1);}for(let k=0;k<6;k++)bits.push(-1);
  const COL=7,span=bits.length*COL;
  const frame=stage(B,{T:T,light:[420,-40,1500],
    under:function(t){const x0=SL[0]-10,yc=SL[1]+SL[3]/2,off=-mod(t/T*span,span);
      ctx.save();ctx.fillStyle=PAT.tape;ctx.fillRect(SL[0]-20,SL[1]-6,SL[2]+40,SL[3]+12);ctx.fillStyle=PAT.under;
      for(let x=x0+off,i=0;x<SL[0]+SL[2]+COL;x+=COL,i++){const b=bits[i%bits.length];if(b<0)continue;
        ctx.beginPath();ctx.arc(x,yc,b?2.4:.9,0,TAU);ctx.fill();}
      ctx.restore();},
    overlay:function(){
      letters(51,'what i write',60,74,'34px LB',-.3,PAT.cream,1.2,.05);
      label(52,D.langs.repos+' public repos  '+DOT+'  '+ent.length+' languages',1540,72,'21px LR',PAT.mint,.4,'right',.2);
      let x=60;const bw=1480;
      items.forEach((it,i)=>{const w=bw*it[1]/tot;piece(60+i,x,104,c=>{c.fillStyle=PAT[it[2]];rrect(c,0,0,Math.max(w-4,2),24,3);c.fill();},.8);x+=w;});
      items.forEach((it,i)=>{const lx=60+(i%4)*370,ly=200+Math.floor(i/4)*46;
        piece(80+i,lx+8,ly-8,c=>{c.fillStyle=PAT[it[2]];c.beginPath();c.arc(0,0,8,0,TAU);c.fill();},.7);
        ctx.font='23px LBo';const w=ctx.measureText(it[0]).width;
        label(90+i,it[0],lx+26,ly,'23px LBo',PAT.cream,.45);label(100+i,(100*it[1]/tot).toFixed(1)+'%',lx+36+w,ly,'23px LR',PAT.mint,.35);});
    }});
  return {w:W,h:H,T:T,fps:FPS,frame:frame};
}
function PAT_KEY(n){return LANG_COLORS[n]?'L_'+n:'L_other';}

const PANELS={about:about,languages:languages,'card-0':function(D){return card(0,D);},'card-1':function(D){return card(1,D);},'card-2':function(D){return card(2,D);},'card-3':function(D){return card(3,D);}};
let DATA=null;
window.setup=function(name,D){DATA=D;const r=PANELS[name](D);window.frame=r.frame;return {w:r.w,h:r.h,T:r.T,fps:r.fps};};
</script></body></html>
