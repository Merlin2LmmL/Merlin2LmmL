<!doctype html><html><head><meta charset="utf-8"><title>board colour</title><style>
body{margin:0;background:#0d1117;color:#e6edf3;font:15px system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;background:#0d1117ee;border-bottom:1px solid #21262d}
button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;border:1px solid #30363d;background:#161b22;color:inherit;cursor:pointer;font:inherit}
button.on{border-color:#e6edf3}button i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px #0006}
#save{margin-left:18px;background:#238636;border-color:#2ea043}#msg{min-width:150px;color:#8b949e}
.page{width:880px;margin:22px auto}.page iframe{border:0;display:block;width:100%;margin-bottom:14px;background:transparent}
.row{display:flex}.row iframe{width:25%;margin:0}
</style></head><body>
<div class="bar" id="bar"></div>
<div class="page"><iframe data-t="header" data-h="560"></iframe><iframe data-t="about" data-h="200"></iframe>
<div class="row"><iframe data-t="card-0" data-h="290" data-w="400"></iframe><iframe data-t="card-1" data-h="290" data-w="400"></iframe><iframe data-t="card-2" data-h="290" data-w="400"></iframe><iframe data-t="card-3" data-h="290" data-w="400"></iframe></div>
<div style="height:14px"></div><iframe data-t="languages" data-h="330"></iframe></div>
<script>
const SW={green:'#44705a',black:'#2b2d31',blue:'#2f5a86',purple:'#5b3a7a',red:'#8a2f2c',white:'#e6e4dd'};
let content,langs,current;const frames=[...document.querySelectorAll('iframe')];
const fontCss=[['LB','black'],['LBo','bold'],['LR','reg'],['MO','mono']];
function fit(f){const w=f.getBoundingClientRect().width;f.style.height=(w*f.dataset.h/(f.dataset.w||1600))+'px';}
async function boot(f){const w=f.contentWindow;w.PREVIEW=true;
  for(const [n,file] of fontCss){const ff=new w.FontFace(n,'url(../fonts/'+file+'.woff2)');await ff.load();w.document.fonts.add(ff);}
  const c=w.document.querySelector('canvas');w.document.body.style.background='transparent';c.style.width='100%';c.style.display='block';fit(f);}
function setupAll(){content.palette=current;const D=JSON.parse(JSON.stringify({content,langs}));
  for(const f of frames)f.contentWindow.setup(f.dataset.t,D);
  document.querySelectorAll('button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===current));}
function loop(){const t=performance.now()/1000;for(const f of frames)if(f.contentWindow.frame)f.contentWindow.frame(t);setTimeout(loop,1000/12);}
(async()=>{content=await (await fetch('../content.json')).json();langs=await (await fetch('../langs.json')).json();current=content.palette||'green';
  const bar=document.getElementById('bar');
  for(const p in SW){const b=document.createElement('button');b.dataset.p=p;b.innerHTML='<i style="background:'+SW[p]+'"></i>'+p;b.onclick=()=>{current=p;setupAll();};bar.appendChild(b);}
  await Promise.all(frames.map(f=>new Promise(r=>{f.onload=r;f.src=(f.dataset.t==='header'?'header.html':'panels.html')+'?'+f.dataset.t;})));
  await Promise.all(frames.map(boot));setupAll();loop();addEventListener('resize',()=>frames.forEach(fit));})();
</script></body></html>
